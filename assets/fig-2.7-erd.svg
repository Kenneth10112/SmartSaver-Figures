<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">SmartSaver SQLite ERD</title>
  <desc id="desc">Entity relationship diagram for the SQLite tables used by the History Server.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 28px; font-weight: 650; fill: #17212b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; fill: #5b6675; }
    .table { fill: #ffffff; stroke: #17212b; stroke-width: 1.5; rx: 4; }
    .thead { fill: #f7f8fa; }
    .tname { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; font-weight: 650; fill: #17212b; }
    .field { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #17212b; }
    .type { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #5b6675; }
    .pk { font-weight: 700; fill: #2f6b4f; }
    .fk { fill: #6b4f9a; }
    .rel { fill: none; stroke: #2b6f78; stroke-width: 2; }
    .reld { fill: none; stroke: #5b6675; stroke-width: 2; stroke-dasharray: 5 4; }
    .card { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #17212b; }
    .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #5b6675; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <text class="title" x="40" y="52">SmartSaver SQLite ERD</text>
  <text class="subtitle" x="40" y="78">History Server schema · logical joins are by part_id; SQLite foreign keys are not declared</text>

  <!-- part_config -->
  <g id="part_config">
    <rect class="table" x="80" y="130" width="350" height="300"/>
    <rect class="thead" x="80" y="130" width="350" height="36"/>
    <text class="tname" x="96" y="155">part_config</text>
    <text class="field" x="96" y="190"><tspan class="pk">PK</tspan> part_id</text>
    <text class="type" x="410" y="190" text-anchor="end">TEXT</text>
    <text class="field" x="96" y="216">display_name</text>
    <text class="type" x="410" y="216" text-anchor="end">TEXT</text>
    <text class="field" x="96" y="242">power_watts</text>
    <text class="type" x="410" y="242" text-anchor="end">REAL</text>
    <text class="field" x="96" y="268">baseline_type</text>
    <text class="type" x="410" y="268" text-anchor="end">TEXT</text>
    <text class="field" x="96" y="294">baseline_hours_per_day</text>
    <text class="type" x="410" y="294" text-anchor="end">REAL</text>
    <text class="field" x="96" y="320">baseline_schedule</text>
    <text class="type" x="410" y="320" text-anchor="end">TEXT</text>
    <text class="field" x="96" y="346">tariff_override</text>
    <text class="type" x="410" y="346" text-anchor="end">REAL</text>
    <text class="field" x="96" y="372">baseline_confidence</text>
    <text class="type" x="410" y="372" text-anchor="end">TEXT</text>
  </g>

  <!-- readings -->
  <g id="readings">
    <rect class="table" x="590" y="130" width="380" height="260"/>
    <rect class="thead" x="590" y="130" width="380" height="36"/>
    <text class="tname" x="606" y="155">readings</text>
    <text class="field" x="606" y="190"><tspan class="pk">PK</tspan> id</text>
    <text class="type" x="950" y="190" text-anchor="end">INTEGER</text>
    <text class="field" x="606" y="216"><tspan class="fk">FK*</tspan> part_id</text>
    <text class="type" x="950" y="216" text-anchor="end">TEXT</text>
    <text class="field" x="606" y="242">source</text>
    <text class="type" x="950" y="242" text-anchor="end">TEXT</text>
    <text class="field" x="606" y="268">capability</text>
    <text class="type" x="950" y="268" text-anchor="end">TEXT</text>
    <text class="field" x="606" y="294">payload</text>
    <text class="type" x="950" y="294" text-anchor="end">TEXT (JSON)</text>
    <text class="field" x="606" y="320">timestamp</text>
    <text class="type" x="950" y="320" text-anchor="end">INTEGER</text>
    <text class="note" x="606" y="366">index (part_id, timestamp) · index (timestamp)</text>
  </g>

  <!-- actuator_events -->
  <g id="actuator_events">
    <rect class="table" x="590" y="470" width="380" height="210"/>
    <rect class="thead" x="590" y="470" width="380" height="36"/>
    <text class="tname" x="606" y="495">actuator_events</text>
    <text class="field" x="606" y="530"><tspan class="pk">PK</tspan> id</text>
    <text class="type" x="950" y="530" text-anchor="end">INTEGER</text>
    <text class="field" x="606" y="556"><tspan class="fk">FK*</tspan> part_id</text>
    <text class="type" x="950" y="556" text-anchor="end">TEXT</text>
    <text class="field" x="606" y="582">state</text>
    <text class="type" x="950" y="582" text-anchor="end">TEXT</text>
    <text class="field" x="606" y="608">timestamp</text>
    <text class="type" x="950" y="608" text-anchor="end">INTEGER</text>
    <text class="note" x="606" y="650">index (part_id, timestamp)</text>
  </g>

  <!-- topology -->
  <g id="topology">
    <rect class="table" x="1080" y="130" width="380" height="210"/>
    <rect class="thead" x="1080" y="130" width="380" height="36"/>
    <text class="tname" x="1096" y="155">topology_events</text>
    <text class="field" x="1096" y="190"><tspan class="pk">PK</tspan> id</text>
    <text class="type" x="1440" y="190" text-anchor="end">INTEGER</text>
    <text class="field" x="1096" y="216">devices</text>
    <text class="type" x="1440" y="216" text-anchor="end">TEXT (JSON)</text>
    <text class="field" x="1096" y="242">parts</text>
    <text class="type" x="1440" y="242" text-anchor="end">TEXT (JSON)</text>
    <text class="field" x="1096" y="268">timestamp</text>
    <text class="type" x="1440" y="268" text-anchor="end">INTEGER</text>
    <text class="note" x="1096" y="310">index (timestamp)</text>
  </g>

  <!-- system_config -->
  <g id="system_config">
    <rect class="table" x="1080" y="410" width="300" height="140"/>
    <rect class="thead" x="1080" y="410" width="300" height="36"/>
    <text class="tname" x="1096" y="435">system_config</text>
    <text class="field" x="1096" y="470"><tspan class="pk">PK</tspan> key</text>
    <text class="type" x="1360" y="470" text-anchor="end">TEXT</text>
    <text class="field" x="1096" y="496">value</text>
    <text class="type" x="1360" y="496" text-anchor="end">TEXT</text>
    <text class="note" x="1096" y="532">currency · tariff · comfort band</text>
  </g>

  <!-- cost -->
  <g id="cost">
    <rect class="table" x="1080" y="600" width="380" height="230"/>
    <rect class="thead" x="1080" y="600" width="380" height="36"/>
    <text class="tname" x="1096" y="625">cost_of_ownership</text>
    <text class="field" x="1096" y="660"><tspan class="pk">PK</tspan> id</text>
    <text class="type" x="1440" y="660" text-anchor="end">INTEGER</text>
    <text class="field" x="1096" y="686">item</text>
    <text class="type" x="1440" y="686" text-anchor="end">TEXT</text>
    <text class="field" x="1096" y="712">amount</text>
    <text class="type" x="1440" y="712" text-anchor="end">REAL</text>
    <text class="field" x="1096" y="738">currency</text>
    <text class="type" x="1440" y="738" text-anchor="end">TEXT</text>
    <text class="field" x="1096" y="764">recurring</text>
    <text class="type" x="1440" y="764" text-anchor="end">INTEGER</text>
    <text class="field" x="1096" y="790">acquired_timestamp</text>
    <text class="type" x="1440" y="790" text-anchor="end">INTEGER</text>
  </g>

  <!-- schema_version -->
  <g id="schema">
    <rect class="table" x="590" y="730" width="380" height="130"/>
    <rect class="thead" x="590" y="730" width="380" height="36"/>
    <text class="tname" x="606" y="755">schema_version</text>
    <text class="field" x="606" y="790"><tspan class="pk">PK</tspan> singleton</text>
    <text class="type" x="950" y="790" text-anchor="end">INTEGER</text>
    <text class="field" x="606" y="816">version</text>
    <text class="type" x="950" y="816" text-anchor="end">INTEGER</text>
    <text class="field" x="606" y="842">applied_at</text>
    <text class="type" x="950" y="842" text-anchor="end">TEXT</text>
  </g>

  <!-- relationships -->
  <line class="rel" x1="430" y1="210" x2="590" y2="210"/>
  <text class="card" x="440" y="202">1</text>
  <text class="card" x="558" y="202">N</text>
  <text class="note" x="440" y="232">part_id (logical)</text>

  <path class="rel" d="M 430 380 L 460 380 L 460 545 L 590 545"/>
  <text class="card" x="440" y="372">1</text>
  <text class="card" x="558" y="537">N</text>
  <text class="note" x="466" y="560">part_id (logical)</text>

  <path class="reld" d="M 1080 300 L 1060 300 L 1060 405 L 430 405 L 430 430"/>
  <text class="note" x="720" y="424">M:N logical snapshot — parts JSON, no FK</text>

  <text class="note" x="80" y="940">* FK* is a logical key only. The server does not declare SQLite FOREIGN KEY constraints; joins and cleanup are handled in Python.</text>
  <text class="note" x="80" y="962">system_config and cost_of_ownership are standalone; schema_version is a singleton row.</text>
</svg>
