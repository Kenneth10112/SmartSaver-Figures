<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Wireless Motion Module</title>
  <desc id="desc">ESP32-C3 with an RCWL-0516 motion sensor. OUT goes to GPIO 3; the module is transmit-only and never parses commands.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 28px; font-weight: 650; fill: #17212b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; fill: #5b6675; }
    .box { fill: #ffffff; stroke: #17212b; stroke-width: 1.5; rx: 6; }
    .head { fill: #f7f8fa; stroke: none; }
    .module { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 20px; font-weight: 650; fill: #17212b; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; fill: #5b6675; }
    .pin { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #17212b; }
    .net { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 650; }
    .wire { fill: none; stroke: #2b6f78; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .p5 { fill: none; stroke: #9a671f; stroke-width: 2.5; stroke-linecap: round; }
    .gnd { fill: none; stroke: #34495e; stroke-width: 2.5; stroke-linecap: round; }
    .flag5 { fill: #9a671f; }
    .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; fill: #5b6675; }
    .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; fill: #5b6675; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text class="title" x="40" y="52">Wireless Motion Module</text>
  <text class="subtitle" x="40" y="78">Paper Circuit · ESP32-C3 · RCWL-0516 · transmit-only</text>

  <!-- C3 -->
  <g id="c3">
    <rect class="box" x="80" y="160" width="260" height="390"/>
    <rect class="head" x="80" y="160" width="260" height="40"/>
    <text class="module" x="98" y="186">ESP32-C3</text>
    <text class="sub" x="98" y="204">Wireless Module · 3.3 V logic</text>

    <text class="pin" x="100" y="250">5V</text>
    <text class="pin" x="100" y="290">GND</text>
    <text class="pin" x="100" y="390">GPIO 3</text>
    <text class="pin" x="100" y="450">3V3</text>

    <line class="p5" x1="340" y1="245" x2="370" y2="245"/>
    <polygon class="flag5" points="370,245 360,240 360,250"/>
    <text class="net" x="380" y="249" fill="#9a671f">+5 V</text>

    <line class="gnd" x1="340" y1="285" x2="365" y2="285"/>
    <line class="gnd" x1="365" y1="285" x2="365" y2="293"/>
    <line class="gnd" x1="355" y1="293" x2="375" y2="293"/>
    <line class="gnd" x1="359" y1="299" x2="371" y2="299"/>
    <line class="gnd" x1="363" y1="305" x2="367" y2="305"/>
    <text class="net" x="385" y="289" fill="#34495e">GND</text>

    <text class="note" x="360" y="381">GPIO 3 ← OUT</text>
    <text class="sub" x="360" y="460">3V3 not used here</text>
  </g>

  <!-- RCWL-0516 -->
  <g id="rcwl">
    <rect class="box" x="700" y="170" width="320" height="260"/>
    <rect class="head" x="700" y="170" width="320" height="40"/>
    <text class="module" x="718" y="196">RCWL-0516</text>
    <text class="sub" x="718" y="214">microwave motion · 3.2 GHz</text>

    <text class="pin" x="720" y="260">VIN</text>
    <text class="pin" x="720" y="350">OUT</text>
    <text class="pin" x="720" y="400">GND</text>

    <line class="p5" x1="700" y1="255" x2="670" y2="255"/>
    <polygon class="flag5" points="670,255 680,250 680,260"/>
    <text class="net" x="660" y="259" text-anchor="end" fill="#9a671f">+5 V</text>

    <line class="wire" x1="700" y1="345" x2="620" y2="345"/>
    <line class="wire" x1="620" y1="345" x2="620" y2="390"/>
    <line class="wire" x1="620" y1="390" x2="340" y2="390"/>
    <text class="note" x="480" y="336">OUT → GPIO 3</text>

    <line class="gnd" x1="700" y1="395" x2="675" y2="395"/>
    <line class="gnd" x1="675" y1="395" x2="675" y2="403"/>
    <line class="gnd" x1="665" y1="403" x2="685" y2="403"/>
    <line class="gnd" x1="669" y1="409" x2="681" y2="409"/>
    <line class="gnd" x1="673" y1="415" x2="677" y2="415"/>
    <text class="net" x="650" y="399" text-anchor="end" fill="#34495e">GND</text>
  </g>

  <!-- Notes / legend -->
  <g id="legend">
    <text class="legend" x="80" y="620" font-weight="650">Wiring notes</text>
    <text class="note" x="80" y="648">OUT is a 3.3 V digital signal; VIN is the 5 V rail and GND is common.</text>
    <text class="note" x="80" y="670">The module transmits `detected` / `clear` only. It never parses a command.</text>
    <text class="note" x="80" y="692">Firmware samples at 1 s and needs two agreeing samples before reporting a change.</text>

    <text class="legend" x="700" y="620" font-weight="650">Legend</text>
    <line class="p5" x1="700" y1="645" x2="730" y2="645"/>
    <text class="legend" x="740" y="649">+5 V</text>
    <line class="gnd" x1="810" y1="645" x2="840" y2="645"/>
    <text class="legend" x="850" y="649">GND</text>
    <line class="wire" x1="920" y1="645" x2="950" y2="645"/>
    <text class="legend" x="960" y="649">signal</text>
  </g>
</svg>
