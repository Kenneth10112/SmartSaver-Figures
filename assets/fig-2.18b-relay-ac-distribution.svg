<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Relay AC Distribution</title>
  <desc id="desc">AC splitter feeding a two-pole relay for six outlets and a phone charger for the ESP32-C3. Protective earth is not switched.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 28px; font-weight: 650; fill: #17212b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; fill: #5b6675; }
    .box { fill: #ffffff; stroke: #17212b; stroke-width: 1.5; rx: 6; }
    .head { fill: #f7f8fa; stroke: none; }
    .module { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 19px; font-weight: 650; fill: #17212b; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; fill: #5b6675; }
    .pin { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #17212b; }
    .net { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 650; }
    .live { fill: none; stroke: #a33a2a; stroke-width: 2.5; stroke-linecap: round; }
    .neutral { fill: none; stroke: #5b6675; stroke-width: 2.5; stroke-linecap: round; }
    .earth { fill: none; stroke: #2f6b4f; stroke-width: 2.5; stroke-linecap: round; }
    .p5 { fill: none; stroke: #9a671f; stroke-width: 2.5; stroke-linecap: round; }
    .gnd { fill: none; stroke: #34495e; stroke-width: 2.5; stroke-linecap: round; }
    .wire { fill: none; stroke: #2b6f78; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .flag5 { fill: #9a671f; }
    .note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; fill: #5b6675; }
    .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; fill: #5b6675; }
  </style>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="40" y="52">Relay AC Distribution</text>
  <text class="subtitle" x="40" y="78">Paper Circuit · mains side must be installed by a qualified person</text>

  <!-- AC source -->
  <g id="source">
    <rect class="box" x="50" y="120" width="180" height="150"/>
    <rect class="head" x="50" y="120" width="180" height="34"/>
    <text class="module" x="66" y="143" font-size="17">AC Mains</text>
    <text class="sub" x="66" y="166">220–230 V · 50 Hz</text>
    <text class="pin" x="62" y="200">L</text>
    <text class="pin" x="62" y="230">N</text>
    <text class="pin" x="62" y="260">PE</text>
    <line class="live" x1="230" y1="195" x2="300" y2="195"/>
    <line class="neutral" x1="230" y1="225" x2="300" y2="225"/>
    <line class="earth" x1="230" y1="255" x2="300" y2="255"/>
  </g>

  <!-- Splitter -->
  <g id="splitter">
    <rect class="box" x="300" y="100" width="230" height="230"/>
    <rect class="head" x="300" y="100" width="230" height="34"/>
    <text class="module" x="318" y="123" font-size="17">AC Splitter</text>
    <text class="sub" x="318" y="146">1 → 2 · L / N / PE</text>

    <text class="pin" x="312" y="200">L1</text>
    <text class="pin" x="312" y="230">N1</text>
    <text class="pin" x="312" y="260">PE</text>
    <text class="pin" x="312" y="295">L2</text>
    <text class="pin" x="312" y="320">N2</text>

    <line class="live" x1="520" y1="195" x2="650" y2="195"/>
    <line class="neutral" x1="520" y1="225" x2="650" y2="225"/>
    <line class="earth" x1="520" y1="255" x2="550" y2="255"/>
    <text class="net" x="555" y="259" fill="#2f6b4f">PE</text>
    <line class="earth" x1="1120" y1="260" x2="1090" y2="260"/>
    <text class="net" x="1080" y="264" text-anchor="end" fill="#2f6b4f">PE</text>
    <line class="earth" x1="1100" y1="260" x2="1120" y2="260"/>

    <line class="live" x1="520" y1="290" x2="600" y2="290"/>
    <line class="live" x1="600" y1="290" x2="600" y2="760"/>
    <line class="live" x1="600" y1="760" x2="1080" y2="760"/>
    <line class="live" x1="1080" y1="760" x2="1080" y2="520"/>
    <line class="live" x1="1080" y1="520" x2="1120" y2="520"/>
    <line class="neutral" x1="520" y1="315" x2="620" y2="315"/>
    <line class="neutral" x1="620" y1="315" x2="620" y2="775"/>
    <line class="neutral" x1="620" y1="775" x2="1090" y2="775"/>
    <line class="neutral" x1="1090" y1="775" x2="1090" y2="550"/>
    <line class="neutral" x1="1090" y1="550" x2="1120" y2="550"/>
  </g>

  <!-- Relay -->
  <g id="relay">
    <rect class="box" x="650" y="80" width="330" height="280"/>
    <rect class="head" x="650" y="80" width="330" height="34"/>
    <text class="module" x="668" y="103" font-size="17">2-Channel Relay</text>
    <text class="sub" x="668" y="126">CH1 = L · CH2 = N · both driven together</text>

    <text class="pin" x="662" y="195">COM1</text>
    <text class="pin" x="662" y="225">COM2</text>
    <text class="pin" x="662" y="270">VCC</text>
    <text class="pin" x="760" y="345" text-anchor="middle">IN1</text>
    <text class="pin" x="900" y="345" text-anchor="middle">IN2</text>
    <text class="pin" x="952" y="195" text-anchor="end">NO1</text>
    <text class="pin" x="952" y="225" text-anchor="end">NO2</text>

    <text class="sub" x="668" y="292">5 V coil · active HIGH</text>
    <line class="p5" x1="650" y1="265" x2="620" y2="265"/>
    <polygon class="flag5" points="620,265 630,260 630,270"/>
    <text class="net" x="610" y="269" text-anchor="end" fill="#9a671f">+5 V</text>
    <line class="wire" x1="980" y1="195" x2="1120" y2="195"/>
    <line class="wire" x1="980" y1="225" x2="1120" y2="225"/>
  </g>

  <!-- Outlets -->
  <g id="outlets">
    <rect class="box" x="1120" y="90" width="400" height="250"/>
    <rect class="head" x="1120" y="90" width="400" height="34"/>
    <text class="module" x="1138" y="113" font-size="17">6 Outlets</text>
    <text class="sub" x="1138" y="136">parallel daisy-chain · not series</text>
    <text class="pin" x="1132" y="195">L</text>
    <text class="pin" x="1132" y="225">N</text>
    <text class="pin" x="1132" y="260">PE</text>

    <!-- outlet symbols -->
    <g id="outlet-row">
      <rect class="box" x="1170" y="170" width="96" height="52"/>
      <rect class="box" x="1278" y="170" width="96" height="52"/>
      <rect class="box" x="1386" y="170" width="96" height="52"/>
      <rect class="box" x="1170" y="235" width="96" height="52"/>
      <rect class="box" x="1278" y="235" width="96" height="52"/>
      <rect class="box" x="1386" y="235" width="96" height="52"/>
    </g>
    <text class="note" x="1170" y="315">L and N buses feed all six in parallel; PE is bonded directly.</text>
  </g>

  <!-- Charger -->
  <g id="charger">
    <rect class="box" x="1120" y="470" width="260" height="170"/>
    <rect class="head" x="1120" y="470" width="260" height="34"/>
    <text class="module" x="1138" y="493" font-size="17">Phone Charger</text>
    <text class="sub" x="1138" y="516">5 V USB-C adapter</text>
    <text class="pin" x="1132" y="525">L</text>
    <text class="pin" x="1132" y="555">N</text>
    <text class="pin" x="1370" y="525" text-anchor="end">USB-C 5 V</text>
    <text class="pin" x="1370" y="555" text-anchor="end">USB-C GND</text>
  </g>

  <!-- C3 -->
  <g id="c3">
    <rect class="box" x="650" y="470" width="330" height="260"/>
    <rect class="head" x="650" y="470" width="330" height="34"/>
    <text class="module" x="668" y="493" font-size="17">ESP32-C3</text>
    <text class="sub" x="668" y="516">module core · 3.3 V logic</text>
    <text class="pin" x="968" y="545" text-anchor="end">5V</text>
    <text class="pin" x="968" y="585" text-anchor="end">GND</text>
    <text class="pin" x="780" y="462">GPIO 3</text>
    <text class="pin" x="920" y="462">GPIO 4</text>

    <!-- USB-C into C3 -->
    <line class="p5" x1="980" y1="540" x2="1120" y2="540"/>
    <line class="gnd" x1="980" y1="575" x2="1120" y2="575"/>
    <text class="note" x="1000" y="532">USB-C 5 V</text>
    <text class="note" x="1000" y="590">GND</text>

    <!-- signal to relay -->
    <line class="wire" x1="760" y1="470" x2="760" y2="360"/>
    <line class="wire" x1="900" y1="470" x2="900" y2="360"/>
    <text class="note" x="774" y="430">GPIO 3 → IN1</text>
    <text class="note" x="914" y="430">GPIO 4 → IN2</text>
  </g>

  <!-- Notes / legend -->
  <g id="legend">
    <text class="legend" x="650" y="790" font-weight="650">Safety and wiring notes</text>
    <text class="note" x="650" y="815">PE is not switched. If the second channel is used for neutral, it is a double-pole disconnect, not a ground switch.</text>
    <text class="note" x="650" y="835">The six outlets are paralleled; they are not wired in series. Use an RCD/breaker and an enclosure.</text>
    <text class="note" x="650" y="855">Relay contacts must be rated for the connected load; mains work is for a qualified person.</text>
    <text class="note" x="650" y="875">Relay VCC is the charger's 5 V rail.</text>

    <text class="legend" x="50" y="790" font-weight="650">Legend</text>
    <line class="live" x1="50" y1="815" x2="80" y2="815"/>
    <text class="legend" x="90" y="819">live L</text>
    <line class="neutral" x1="160" y1="815" x2="190" y2="815"/>
    <text class="legend" x="200" y="819">neutral N</text>
    <line class="earth" x1="290" y1="815" x2="320" y2="815"/>
    <text class="legend" x="330" y="819">protective earth PE</text>
    <line class="wire" x1="50" y1="845" x2="80" y2="845"/>
    <text class="legend" x="90" y="849">relay contact</text>
    <line class="p5" x1="200" y1="845" x2="230" y2="845"/>
    <text class="legend" x="240" y="849">5 V</text>
  </g>
</svg>
