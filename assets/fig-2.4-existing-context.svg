<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Existing Context Diagram</title>
  <desc id="desc">The manual household process before SmartSaver: occupant, appliances and the monthly bill, with no sensors or automation.</desc>
  <style>
    .bg{fill:#fff}.title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:28px;font-weight:650;fill:#17212b}
    .sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;fill:#5b6675}
    .entity{fill:#fff;stroke:#17212b;stroke-width:1.5}
    .process{fill:#fff;stroke:#9a671f;stroke-width:2.5;rx:22}
    .label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;font-weight:650;fill:#17212b}
    .small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:11.5px;fill:#5b6675}
    .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:700;fill:#9a671f}
    .arrow{fill:none;stroke:#2b6f78;stroke-width:2;marker-end:url(#a)}
    .loop{fill:none;stroke:#a33a2a;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#ar)}
    .tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:11px;fill:#5b6675}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#2b6f78"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#a33a2a"/></marker>
  </defs>
  <rect class="bg" width="1400" height="700"/>
  <text class="title" x="40" y="52">Existing Context Diagram</text>
  <text class="sub" x="40" y="78">The manual household process · no software, no sensors, no automation</text>

  <g id="occupant">
    <rect class="entity" x="80" y="150" width="230" height="110"/>
    <text class="label" x="98" y="180">Occupant</text>
    <text class="small" x="98" y="204">remembers · walks through</text>
    <text class="small" x="98" y="224">switches off by hand</text>
  </g>

  <g id="process">
    <rect class="process" x="560" y="260" width="280" height="220"/>
    <text class="num" x="700" y="345" text-anchor="middle">0</text>
    <text class="label" x="700" y="380" text-anchor="middle">Manual Routine</text>
    <text class="small" x="700" y="404" text-anchor="middle">habit · memory · inspection</text>
    <text class="small" x="700" y="424" text-anchor="middle">no automatic check</text>
  </g>

  <g id="appliances">
    <rect class="entity" x="1090" y="150" width="230" height="110"/>
    <text class="label" x="1108" y="180">Appliances</text>
    <text class="small" x="1108" y="204">fan · light · air-conditioning</text>
    <text class="small" x="1108" y="224">state not monitored</text>
  </g>

  <g id="bill">
    <rect class="entity" x="1090" y="470" width="230" height="110"/>
    <text class="label" x="1108" y="500">Utility Bill</text>
    <text class="small" x="1108" y="524">monthly · aggregated</text>
    <text class="small" x="1108" y="544">no room attribution</text>
  </g>

  <!-- flows -->
  <path class="arrow" d="M 310 205 L 450 205 L 450 310 L 560 310"/>
  <text class="tag" x="330" y="197">leaves room / remembers</text>

  <path class="arrow" d="M 840 310 L 960 310 L 960 205 L 1090 205"/>
  <text class="tag" x="860" y="302">switch by hand</text>

  <path class="arrow" d="M 1090 260 L 1020 260 L 1020 400 L 840 400"/>
  <text class="tag" x="880" y="392">runs unnoticed</text>

  <path class="arrow" d="M 1090 525 L 1000 525 L 1000 460 L 840 460"/>
  <text class="tag" x="890" y="452">monthly statement</text>

  <path class="loop" d="M 1100 580 L 1100 620 L 195 620 L 195 260"/>
  <text class="tag" x="700" y="612" text-anchor="middle">the only feedback loop closes when the bill arrives — too late to act</text>

  <text class="tag" x="80" y="680">There is no live measurement and no actuator state; the system is entirely dependent on human action.</text>
</svg>
