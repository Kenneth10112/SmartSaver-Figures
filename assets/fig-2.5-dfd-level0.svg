<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">DFD Level 0</title>
  <desc id="desc">Context diagram for SmartSaver. All flows use right-angle routing.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 28px; font-weight: 650; fill: #17212b; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; fill: #5b6675; }
    .entity { fill: #ffffff; stroke: #17212b; stroke-width: 1.5; }
    .process { fill: #ffffff; stroke: #2f6b4f; stroke-width: 2.5; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 17px; font-weight: 650; fill: #17212b; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11.5px; fill: #5b6675; }
    .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 26px; font-weight: 700; fill: #2f6b4f; }
    .arrow { fill: none; stroke: #2b6f78; stroke-width: 2; marker-end: url(#arrow); }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #5b6675; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#2b6f78"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="800"/>
  <text class="title" x="40" y="52">DFD Level 0</text>
  <text class="subtitle" x="40" y="78">Context diagram · one process, four external entities</text>

  <!-- Process 0 -->
  <g id="process0">
    <rect class="process" x="560" y="280" width="280" height="240" rx="26"/>
    <text class="num" x="700" y="365" text-anchor="middle">0</text>
    <text class="label" x="700" y="400" text-anchor="middle">SmartSaver</text>
    <text class="sub" x="700" y="424" text-anchor="middle">local control +</text>
    <text class="sub" x="700" y="442" text-anchor="middle">optional reporting</text>
  </g>

  <!-- Occupant -->
  <g id="occupant">
    <rect class="entity" x="80" y="100" width="230" height="110"/>
    <text class="label" x="98" y="130">Occupant</text>
    <text class="sub" x="98" y="154">phone / laptop browser</text>
    <text class="sub" x="98" y="174">rules · pairing · override</text>
  </g>

  <!-- Wired sensors -->
  <g id="sensors">
    <rect class="entity" x="80" y="590" width="230" height="110"/>
    <text class="label" x="98" y="620">Wired Sensors</text>
    <text class="sub" x="98" y="644">motion · climate · light</text>
    <text class="sub" x="98" y="664">RTC timestamp</text>
  </g>

  <!-- Wireless modules -->
  <g id="modules">
    <rect class="entity" x="1090" y="100" width="230" height="110"/>
    <text class="label" x="1108" y="130">Wireless Modules</text>
    <text class="sub" x="1108" y="154">ESP32-C3 · one capability</text>
    <text class="sub" x="1108" y="174">relay or motion</text>
  </g>

  <!-- History -->
  <g id="history">
    <rect class="entity" x="1090" y="590" width="230" height="110"/>
    <text class="label" x="1108" y="620">History Server</text>
    <text class="sub" x="1108" y="644">optional · SQLite</text>
    <text class="sub" x="1108" y="664">savings + health</text>
  </g>

  <!-- Occupant: to process -->
  <path class="arrow" d="M 310 145 L 480 145 L 480 300 L 560 300"/>
  <text class="tag" x="330" y="137">rules, config, override</text>

  <!-- Occupant: return from process -->
  <path class="arrow" d="M 560 320 L 400 320 L 400 190 L 310 190"/>
  <text class="tag" x="330" y="210">live state + dashboards</text>

  <!-- Sensors: to process -->
  <path class="arrow" d="M 310 635 L 440 635 L 440 500 L 560 500"/>
  <text class="tag" x="330" y="627">motion, climate, light</text>

  <!-- Modules: state reports to process -->
  <path class="arrow" d="M 1090 145 L 960 145 L 960 300 L 840 300"/>
  <text class="tag" x="900" y="137">state reports</text>

  <!-- Process: commands to modules -->
  <path class="arrow" d="M 840 340 L 1010 340 L 1010 190 L 1090 190"/>
  <text class="tag" x="900" y="332">commands</text>

  <!-- Process: events to history -->
  <path class="arrow" d="M 840 500 L 1010 500 L 1010 635 L 1090 635"/>
  <text class="tag" x="880" y="492">readings, events, topology</text>

  <text class="tag" x="80" y="748">The History Server is one-way: it receives events and never commands the Hub.</text>
</svg>
